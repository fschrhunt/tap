name: Release

# A tag vX.Y.Z on main releases tap: the same checks as CI, archives for macOS and Linux with
# checksums and build provenance, notes from CHANGELOG.md, a Homebrew formula PR, and a
# real install of the release on both systems. scripts/release.sh asks Actions to make the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    environment: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release and push its tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($commit) is '$result'; wait for it to pass." >&2; exit 1; }
          git tag -a "$TAG" -m "$TAG"
          GH_TOKEN="$RELEASE_TOKEN" git -c credential.helper= -c "credential.helper=!gh auth git-credential" push origin "$TAG"

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: The tag is on main and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
      - run: ./x check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/package
          cp LICENSE dist/package/
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              export GOOS GOARCH
              ./x build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/package/tap ./cmd/tap
              tar -czf "dist/tap_${TAG}_${GOOS}_${GOARCH}.tar.gz" -C dist/package tap LICENSE
            done
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      # Proves each archive was built here, from this tag: gh attestation verify FILE -R fschrhunt/tap
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md, from its heading to the next.
        run: |
          awk -v tag="$TAG" '/^## /{on = index($0, "## " tag " ") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md

  # Refreshes the Homebrew formula after publishing the release.
  formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$TAG" = "$latest" || { echo "Not the latest stable release; leaving the formula unchanged."; exit 0; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          scripts/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > tap.rb
          python3 scripts/formula_pr.py

  install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release as people will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/tap"
          test "$("$RUNNER_TEMP/tap/tap" --version)" = "$TAG"
