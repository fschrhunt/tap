name: Release

# A release tag vX.Y.Z releases tap: the same checks as CI, archives for macOS and Linux with
# checksums and build provenance, notes from CHANGELOG.md, a Homebrew formula PR, and a
# real install of the release on both systems. .github/release/release.sh asks Actions to make the tag.#
# CHANGELOG.md is an output. .github/release/release.sh starts this with
# reviewed notes; the tag job adds them to CHANGELOG.md in a release commit on
# top of main, tags that commit, and opens a pull request that brings the
# changelog to main. The tag then runs the release with the same notes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.0.0
        required: true
        type: string
      notes:
        description: Release notes, as Markdown
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    environment: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release and push its tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($commit) is '$result'; wait for it to pass." >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo 'The release notes are empty.' >&2; exit 1; }
          .github/release/changelog.sh "$TAG" "$RUNNER_TEMP/notes.md"
          git -c core.hooksPath=/dev/null commit -qm "release: $TAG" -- CHANGELOG.md
          git tag -a "$TAG" -m "$TAG"
          # The release token's pushes start workflows: the tag runs the
          # release, and the branch runs CI for the changelog's pull request.
          GH_TOKEN="$RELEASE_TOKEN" git -c credential.helper= -c "credential.helper=!gh auth git-credential" \
            push origin "refs/tags/$TAG" "HEAD:refs/heads/release/$TAG"
          GH_TOKEN="$RELEASE_TOKEN" gh pr create --base main --head "release/$TAG" --title "release: $TAG" \
            --body "Adds the $TAG notes to CHANGELOG.md. The $TAG tag already points at this commit; merge after CI passes."

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
      # A release tag points at its release commit: one commit on top of main
      # that only adds the release's notes to CHANGELOG.md.
      - name: The tag is a release commit on main with notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA^" origin/main || { echo "$TAG is not a release commit on top of main" >&2; exit 1; }
          [ "$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")" = CHANGELOG.md ] || { echo "The $TAG release commit may only change CHANGELOG.md" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
      - run: ./x check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: .github/release/package.sh
      - name: Verify the packaged release
        env:
          TAG: ${{ github.ref_name }}
          TAP_PACKAGE_DIR: dist
        run: ./x package-check
      # Proves each archive was built here, from this tag: gh attestation verify FILE -R fschrhunt/tap
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md, from its heading to the next.
        run: |
          awk -v tag="$TAG" '/^## /{on = index($0, "## " tag " ") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md

  # Refreshes the Homebrew formula after publishing the release.
  formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}^" origin/main
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$TAG" = "$latest" || { echo "Not the latest stable release; leaving the formula unchanged."; exit 0; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          .github/release/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > tap.rb
          python3 .github/release/formula_pr.py

  install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release as people will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/tap"
          test "$("$RUNNER_TEMP/tap/tap" --version)" = "$TAG"
