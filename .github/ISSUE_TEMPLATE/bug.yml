name: Bug report
description: Report unexpected behavior in tap.
title: "Bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example without sensitive values.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: tap version output
      render: text
    validations:
      required: true
  - type: textarea
    id: servers
    attributes:
      label: tap list output
      description: Remove sensitive values before sharing.
      render: text
    validations:
      required: true
